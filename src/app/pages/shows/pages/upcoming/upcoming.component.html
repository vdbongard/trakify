@if (upcomingEpisodesQuery.isPending()) {
  <t-spinner />
}

@if (filteredEpisodePages(); as filteredPages) {
  @for (upcomingEpisodesPage of filteredPages; track $index) {
    <t-shows
      [showsInfos]="upcomingEpisodesPage"
      [back]="router.url"
      withEpisode
      withLinkToEpisode
      withRelativeDate
      withoutCustomProperty
    />
  }

  <button
    matButton
    (click)="upcomingEpisodesQuery.fetchNextPage()"
    [disabled]="nextButtonDisabled()"
  >
    {{ nextButtonText() }}
  </button>
}

@if (upcomingEpisodesQuery.error(); as error) {
  <t-error-text [error]="error" />
}
