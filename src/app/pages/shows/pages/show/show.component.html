@if (showQuery.isPending()) {
  <t-spinner />
} @else if (!showData()) {
  @if (showQuery.error(); as error) {
    <t-error-text [error]="error" showRetry (retry)="showQuery.refetch()" />
  }
} @else {
  <div class="container">
    <t-show-header
      [isLoggedIn]="authService.isLoggedIn()"
      [posterPath]="posterPath()"
      [showWatched]="showWatched()"
      [tmdbShow]="tmdbShow()"
      [show]="showData()"
      [isFavorite]="isFavorite()"
      [isSmall]="isSmall()"
      [isNewShow]="isNewShow()"
      [isWatchlist]="isWatchlist()"
      [disablePosterFadeIn]="!!info?.tmdbShow"
      (addFavorite)="showService.addFavorite($event)"
      (removeFavorite)="showService.removeFavorite($event)"
      (addToWatchlist)="executeService.addToWatchlist($event)"
      (removeFromWatchlist)="executeService.removeFromWatchlist($event)"
      (showTrailer)="dialogService.showTrailer($event)"
    />

    <t-show-cast [cast]="cast()" [traktPersonSlugs]="traktPersonSlugs()" />

    <t-show-details [tmdbShow]="tmdbShow()" />

    <!-- `isNewShow` is tri-state on the page. The episode component coerces with
         `booleanAttribute`, which would turn `undefined` into `false` and make it treat an
         unknown show as already-started. Keep the previous "assume new while unknown"
         behaviour here; only the header needs to withhold its buttons. -->
    <t-show-next-episode
      [isLoggedIn]="authService.isLoggedIn()"
      [isLoading]="nextEpisodeLoading()"
      [nextEpisode]="nextEpisode()"
      [previousUrl]="previousUrl"
      [showProgress]="showProgress()"
      [progressView]="progressView()"
      [isNewShow]="isNewShow() ?? true"
      [tmdbShow]="tmdbShow()"
      [tmdbSeason]="tmdbSeason()"
      [show]="showData()"
      [showWatched]="showWatched()"
      [seenLoading]="seenLoading()"
      [seenFeedbackEpisodeId]="seenFeedbackEpisodeId()"
      (addEpisode)="addToHistory($event.episode, $event.show)"
      (removeEpisode)="executeService.removeEpisode($event.episode, $event.show)"
    />

    <t-show-seasons
      [show]="showData()"
      [showProgress]="showProgress()"
      [progressView]="progressView()"
      [seasonsEpisodes]="episodes()"
      [tmdbShow]="tmdbShow()"
      [back]="back"
    />

    <t-show-links [show]="showData()" [tmdbShow]="tmdbShow()" />
  </div>
}
