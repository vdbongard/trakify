@if (upcomingEpisodesQuery.isPending()) {
  <t-spinner />
}

@if (filteredEpisodePages(); as filteredPages) {
  @for (upcomingEpisodesPage of filteredPages; track $index; let pageIndex = $index) {
    <t-shows
      [showsInfos]="upcomingEpisodesPage"
      [offset]="pageOffsets()[pageIndex]"
      [withEagerImages]="pageIndex === 0"
      [back]="router.url"
      [showEmptyState]="pageIndex === 0 && !hasVisibleEpisodes()"
      withEpisode
      withLinkToEpisode
      withRelativeDate
      withoutCustomProperty
    />
  }

  <button
    matButton
    (click)="upcomingEpisodesQuery.fetchNextPage()"
    [disabled]="nextButtonDisabled()"
  >
    {{ nextButtonText() }}
  </button>
}

@if (!upcomingEpisodesQuery.data() && upcomingEpisodesQuery.error(); as error) {
  <t-error-text [error]="error" showRetry (retry)="retryUpcomingQuery()" />
}
