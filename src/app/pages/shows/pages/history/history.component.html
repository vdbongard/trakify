@if (isPending()) {
  <t-spinner />
}

@if (groups().length) {
  @for (group of groups(); track $index) {
    <section class="day-group">
      <h2 class="mat-title-small day-label">{{ group.label }}</h2>
      <mat-list class="default-list">
        @for (play of group.plays; track play.id) {
          <a
            class="episode-link"
            [routerLink]="episodeLink(play)"
            [state]="{
              back: router.url,
              episodeInfo: {
                show: play.show,
                tmdbEpisode: tmdbEpisodeFor(play),
              },
            }"
            (click)="prepareViewTransition(row)"
          >
            <mat-list-item>
              <t-history-item
                #row
                [play]="play"
                [tmdbShow]="tmdbShowFor(play)"
                [tmdbEpisode]="tmdbEpisodeFor(play)"
                [i]="playIndex(play)"
              />
            </mat-list-item>
          </a>
        }
      </mat-list>
    </section>
  }

  <div #pageSentinel class="page-sentinel" aria-hidden="true"></div>
} @else if (!isPending() && !error()) {
  <p class="empty-state mat-body-medium">No episodes watched yet.</p>
}

@if (error(); as error) {
  <t-error-text [error]="error" />
}
