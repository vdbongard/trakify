@if (withLink() && episodeLink()) {
  <!-- A fallback still is a generic image, but it still stands for this Episode: link it like the
       artwork it replaces. -->
  <a
    class="still-wrapper"
    [style.view-transition-name]="transitionName()"
    [routerLink]="episodeLink()"
    [state]="stateWithBack()"
  >
    <ng-container *ngTemplateOutlet="stillContent" />
  </a>
} @else {
  <div class="still-wrapper" [style.view-transition-name]="transitionName()">
    @if (tmdbEpisode()?.still_path) {
      <a
        class="image-link"
        [href]="stillSrc()"
        [attr.data-pswp-width]="stillWidth() ?? 1920"
        [attr.data-pswp-height]="stillHeight() ?? 1080"
        data-cropped="true"
        target="_blank"
      >
        <ng-container *ngTemplateOutlet="stillContent" />
      </a>
    } @else {
      <ng-container *ngTemplateOutlet="stillContent" />
    }
  </div>
}

<ng-template #stillContent>
  @if (tmdbEpisode()?.still_path) {
    <ng-container *ngTemplateOutlet="image" />
  } @else if (tmdbEpisode()) {
    <img ngSrc="/still.png" priority width="800" height="450" alt="Still" />
  } @else {
    <div class="still-thumbnail" #imageElement></div>
  }
</ng-template>

<ng-template #image>
  @if (transitionTarget()) {
    <!-- The view this still is morphing out of already showed this Episode's artwork, in the size the
         History lists it in — the very file this page's own image is a bigger version of. Stand that
         copy in underneath it: the still is on screen from the first frame of the transition, and
         without it the artwork would give way to an empty box for as long as the bigger file takes. -->
    <img
      class="still-thumbnail still-stand-in"
      [src]="ImagePrefixW300 + tmdbEpisode()?.still_path"
      decoding="sync"
      width="300"
      height="169"
      alt=""
    />
  }
  <img
    [src]="stillSrc()"
    fetchpriority="high"
    loading="eager"
    width="1920"
    height="1080"
    alt="Episode still"
    (load)="onStillImageLoad()"
    class="image still-thumbnail"
    [class.not-loaded]="!stillLoaded() && !transitionTarget()"
    #imageElement
  />
</ng-template>
