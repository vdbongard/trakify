@if (showQuery.isPending()) {
  <t-spinner />
} @else if (!showData() && showQuery.error(); as error) {
  <t-error-text [error]="error" showRetry (retry)="showQuery.refetch()" />
} @else {
  <t-season-header
    [breadcrumbParts]="breadcrumbParts()"
    [seasonProgress]="seasonProgress() ?? undefined"
    [seasonNumber]="season()"
    [showSlug]="show()"
    [seasons]="seasonsQuery.data() ?? undefined"
    [progressView]="progressView()"
  />

  @if (seasonEpisodesQuery.isPending()) {
    <t-spinner />
  } @else if (!seasonEpisodesQuery.data() && seasonEpisodesQuery.error(); as error) {
    <t-error-text [error]="error" showRetry (retry)="seasonEpisodesQuery.refetch()" />
  } @else {
    <t-season-episodes
      [isLoggedIn]="authService.isLoggedIn()"
      [episodes]="seasonEpisodesQuery.data() ?? undefined"
      [show]="showData()"
      [seasonNumber]="season()"
      [seasonProgress]="seasonProgress() ?? undefined"
      (addEpisode)="executeService.addEpisodeBatched($event.episode, $event.show)"
      (removeEpisode)="executeService.removeEpisodeBatched($event.episode, $event.show)"
    />
  }
}
