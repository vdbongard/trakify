<a class="history-item" [routerLink]="episodeLink()" [state]="{ back: back() }">
  <div class="thumb">
    @if (stillPath()) {
      <img
        class="thumb-image"
        [ngSrc]="ImagePrefixW300 + stillPath()"
        width="300"
        height="169"
        [alt]="episodeTitle()"
      />
    } @else if (posterPath()) {
      <img
        class="thumb-image"
        [ngSrc]="ImagePrefixW185 + posterPath()"
        width="185"
        height="278"
        alt="Poster"
      />
    } @else {
      <div class="thumb-placeholder"></div>
    }
  </div>

  <div class="details">
    <p class="mat-label-small show-title">{{ showName() }}</p>
    <p class="mat-body-medium episode-label">
      S{{ play().episode.season | number: '2.0-0' }}E{{ play().episode.number | number: '2.0-0' }} ·
      {{ episodeTitle() }}
    </p>
    <time class="mat-label-small watched-at">{{ watchedAt() }}</time>
  </div>
</a>
