@if (displayMessage(); as message) {
  <p class="mat-body-medium">{{ message }}</p>
} @else if (typeof error() === 'object' && error().message; as message) {
  <p class="mat-body-medium">{{ message }}</p>
} @else if (typeof error() === 'object') {
  <p class="mat-body-medium">{{ error() | json }}</p>
} @else {
  <p class="mat-body-medium">{{ error() }}</p>
}

@if (showRetry()) {
  <button matButton type="button" (click)="retry.emit()">Retry</button>
}
