@if (episodeCount(); as count) {
  @if (withDividerLeft()) {
    {{ Divider }}
  }
  @if (count === 'total') {
    @if (totalEpisodes() === 1) {
      1 episode
    } @else {
      {{ totalEpisodes() }} episodes
    }
  } @else {
    {{ remainingEpisodesCount() }} remaining
  }
  @if (withDividerRight()) {
    {{ Divider }}
  }
}
