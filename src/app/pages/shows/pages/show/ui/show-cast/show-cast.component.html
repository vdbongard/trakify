<h2 class="mat-title-medium">Cast</h2>
<div class="cast-wrapper">
  @for (castSingle of cast(); track castSingle.id) {
    <div class="cast">
      <a [href]="getPersonUrl(castSingle.id, castSingle.name)" target="_blank" rel="noopener">
        @if (castSingle.profile_path && !hasFailedProfileImage(castSingle)) {
          <img
            [ngSrc]="posterPrefix + castSingle.profile_path"
            width="185"
            height="278"
            [alt]="castSingle.name"
            class="cast-profile"
            (error)="onProfileImageError(castSingle)"
          />
        } @else {
          <img ngSrc="/poster.png" width="154" height="231" [alt]="castSingle.name" />
        }
      </a>

      <p class="mat-body-medium cast-name" ticker>{{ castSingle.name }}</p>
      <p class="mat-body-medium cast-character" ticker>
        {{ castSingle.roles[0]?.character || 'Role not listed' }}
      </p>
    </div>
  }

  @if (cast()?.length === 0) {
    <h3 class="mat-body-medium no-cast">No cast available.</h3>
  }
</div>
